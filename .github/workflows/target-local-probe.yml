name: Target La Cantera local-price validation

on:
  push:
    branches:
      - food-real-scrape-20260811
    paths:
      - 'real_price_scrape/target_local_probe.py'
      - '.github/workflows/target-local-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Validate Target location IDs
        run: python real_price_scrape/target_local_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-la-cantera-probe
          path: target_local_probe_output/
          if-no-files-found: warn
          retention-days: 7
